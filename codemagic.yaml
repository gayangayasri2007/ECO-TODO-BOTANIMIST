workflows:
  android-release:
    name: Eco Todo Botanimist Release
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "botanimism.by.gayangayasri"

    scripts:
      - name: Set up permissions and environment
        script: |
          chmod +x gradlew
          touch .env

      - name: Run unit tests
        script: |
          ./gradlew testDebugUnitTest

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease

      - name: Build Release App Bundle (.aab)
        script: |
          ./gradlew bundleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - gayangayasri2007@gmail.com
        notify:
          success: true
          failure: true
